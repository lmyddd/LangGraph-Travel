# ============================================================
# travel-AI Nginx 生产环境配置
#
# 架构：
#   浏览器 → Nginx (:80) ─┬─ /api/*  → Express 后端 (:3300)
#                         └─ 其他    → Vue 前端静态文件 (travel-h5/dist/)
#
# 部署步骤：
#   1. 前端构建：cd travel-h5 && npm run build
#   2. 后端启动：cd travel-server && npm start
#   3. Nginx：将本文件链接到 /etc/nginx/sites-enabled/ 并 reload
#
# 配合 vite-plugin-compression：
#   构建时已预生成 .gz / .br 文件，Nginx 通过 gzip_static
#   直接返回预压缩文件，零 CPU 开销
# ============================================================

server {
    listen 80;
    server_name localhost;          # 生产环境改为你的域名

    # ---- 字符集 ----
    charset utf-8;

    # ---- 前端静态资源 ----
    # 用 alias 或 root 指向 Vue 构建产物目录
    root /path/to/travel-AI-main/travel-h5/dist;
    index index.html;

    # ---- Gzip 预压缩 ----
    # 优先返回构建时生成好的 .gz 文件，避免实时压缩消耗 CPU
    gzip_static on;                 # 使用预生成的 .gz
    gzip_vary on;                   # 响应头加 Vary: Accept-Encoding
    gzip_proxied any;               # 代理请求也压缩
    gzip_http_version 1.1;         # 最低 HTTP/1.1

    # ---- Brotli 预压缩（需要 ngx_brotli 模块）----
    # 比 Gzip 小 15-25%，现代浏览器全支持
    # 如果没有编译 brotli 模块，这两行删除即可
    brotli_static on;
    brotli on;

    # ---- 静态资源缓存策略 ----
    # 带 hash 的 JS/CSS/图片 → 永久缓存（文件名变了就是新文件）
    location ~* ^/assets/.+\.(js|css|png|jpg|svg|woff2?)\.gz$ {
        internal;                   # .gz 文件不对客户端直接暴露
    }
    location ~* ^/assets/.+\.(js|css|png|jpg|svg|woff2?)\.br$ {
        internal;                   # .br 文件也不对客户端直接暴露
    }
    location ~* ^/assets/.+\.(js|css|png|jpg|svg|woff2?)$ {
        expires 1y;                 # 缓存一年
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存（确保版本更新后用户拿到新页面）
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- SPA 路由回退 ----
    # Vue Router history 模式：所有非 API 路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API 反向代理 ----
    # 将 /api/* 请求转发到 Express 后端
    location /api/ {
        proxy_pass http://127.0.0.1:3300;

        # 透传原始请求信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式请求：关闭缓冲，否则 AI 流式输出会被 Nginx 攒到一块才推送
        proxy_buffering off;
        proxy_cache off;                # 不从缓存响应 SSE
        proxy_read_timeout 3600s;       # SSE 可能持续较长时间（AI 规划最长几分钟）
        proxy_send_timeout 3600s;

        # 长连接支持
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }

    # ---- 安全头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---- 日志（可选） ----
    access_log /var/log/nginx/travel-ai.access.log;
    error_log  /var/log/nginx/travel-ai.error.log;
}

